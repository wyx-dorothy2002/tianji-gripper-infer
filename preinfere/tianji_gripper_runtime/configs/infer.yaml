robot_backend: tianji_gripper_host
gripper_backend: rs05_mit_end_channel
left_gripper_backend: rs05_mit_end_channel
right_gripper_backend: rs05_mit_end_channel
robot_ip: 192.168.2.168

# Arm SDK is configured independently from the gripper SDK below.
# Set robot_backend: tianji_gripper_host when sending commands to the Tianji arms.

# NOTE:
# This path can point either to the legacy `tianji_output` checkout or directly
# to a MARVIN_SDK directory. The runtime auto-detects the matching adapter.
tianji_sdk_root: /home/user/workspace/TJ-gripper-codex-gripper-fixes-20260617-reclone/reference/MARVIN_SDK
tianji_config_path: /home/user/workspace/TJ-gripper-codex-gripper-fixes-20260617-reclone/reference/MARVIN_SDK/DEMO_PYTHON/ccs_m3.MvKDCfg
tianji_vel_ratio: 80
tianji_acc_ratio: 70
tianji_settle_sec: 0.5
tianji_tool_arm_a_kinematics: "0,0,0,0,0,0"
tianji_tool_arm_a_dynamics: "0.407936,83.093744,83.908698,311.682330,0.019412,0,0,0.001,0,0.019863"
tianji_tool_arm_b_kinematics: "0,0,0,0,0,0"
tianji_tool_arm_b_dynamics: "0.428222,40.605956,2.428646,248.022467,0.011021,0,0,0.001,0,0.002569"
# state=3 后下发的关节阻抗参数；顺序为 J1~J7，直接对应 Marvin SDK 的 K/D。
# 左臂 A：K=[6,6,6,4,4,3,3]，D=[1,0.4,0.4,0.4,0,0,0]。
tianji_state3_joint_k_a: "6,6,6,4,4,3,3"
tianji_state3_joint_d_a: "1,0.4,0.4,0.4,0,0,0"
# 右臂 B：K=[6,6,6,4,3,3,3]，D 与 A 臂相同。
tianji_state3_joint_k_b: "6,6,6,4,3,3,3"
tianji_state3_joint_d_b: "1,0.4,0.4,0.4,0,0,0"
tianji_home_joints_a: "90,-90,-90,0,0,0,0"
tianji_home_joints_b: "-90,-90,90,0,0,0,0"

# Gripper SDK boundary. Keep left fake if only the right gripper is installed/used.
# Once the real SDK is known, set right_gripper_backend: generic_sdk and fill these.
left_gripper_ip:
left_gripper_port:
left_gripper_serial:
right_gripper_ip:
right_gripper_port:
right_gripper_serial:
gripper_sdk_module:
gripper_sdk_class:
left_gripper_home:
right_gripper_home:
# Left-side freeze targets are intentionally unset for dual-arm inference.
# In dual_arm_dual_gripper mode, both Arm A and its gripper must use live SDK
# feedback. These options are only valid for right_arm_right_gripper mode.
left_arm_freeze_q:
left_gripper_freeze_q:

# TJ-style RS05/MIT end-channel gripper backend.
# Use right_gripper_backend: rs05_mit_end_channel if the gripper is driven through
# the Tianji/Marvin arm end 485/CAN channel instead of a standalone Python SDK.
gripper_485_arm: B
gripper_485_com: 1
left_gripper_485_arm: A
left_gripper_485_com: 1
right_gripper_485_arm: B
right_gripper_485_com: 1
gripper_direct_onset: true
gripper_rs05_target_id: 0x08
gripper_rs05_master_id: 0xFD
gripper_can_id_byteorder: little
gripper_standard_id_bytes: 4
gripper_enter_motor: true
gripper_stop_on_disconnect: false
gripper_kp: 40
gripper_kd: 5
gripper_torque_nm: 0.0
# Derived from the collection calibration: opening=[-1,96] mm,
# zero=0 mm, travel=0.840824 rev, mm_sign=-1.
gripper_min_pos_rad: -5.283053
gripper_max_pos_rad: 0.055032
# 夹爪反馈力矩保护；false 保持原有夹爪下发逻辑，true 时启用下列抓取检测与保持控制。
gripper_torque_protection_enabled: false
# RS05 反馈信号来源；torque 使用反馈中的 torque_nm，disabled 可临时禁用检测。
gripper_torque_protection_mode: torque
# 力矩一阶低通滤波系数，取值范围 0~1；越大越跟随当前反馈。
gripper_torque_filter_alpha: 0.3
# 连续达到该反馈力矩（Nm）后，认为已经夹到物体。
gripper_torque_threshold_nm: 1.0
# 已抓取且未继续闭合时，滤波力矩低于该值（Nm）则解除保持状态；张开命令会立即解除。
gripper_torque_release_threshold_nm: 0.2
# 连续满足力矩阈值的反馈帧数量，用于避免单帧噪声误触发。
gripper_torque_count_threshold: 5
# 检测到物体后仍允许追加的闭合行程（rad）；0 表示停在当前反馈位置。
gripper_torque_extra_tighten_rad: 0.0
# 抓取锁存后使用的较低 MIT 保持增益，减少继续挤压物体的力。
gripper_holding_kp: 4.0
gripper_holding_kd: 0.1
# 当前标定中 rad 增大表示夹爪闭合，故为 1；若硬件方向相反改为 -1。
gripper_closing_direction: 1.0
# 目标与反馈的位移小于该值时不判定为张开或闭合，避免零点附近反复切换。
gripper_torque_direction_deadband_rad: 0.01

camera:
  - head:realsense:401622070444
  - left_wrist:realsense:260422274472
  - right_wrist:realsense:260522278232

camera_width: 424
camera_height: 240
camera_capture_fps: 30
camera_fps: 30
max_camera_age_ms: 150
camera_warmup_sec: 3

policy_type: pi
control_mode: dual_arm_dual_gripper
pi_action_layout: ziyi_16d_right_left_dual_gripper
policy_host: 127.0.0.1
policy_port: 8000
policy_timeout_ms: 15000
policy_wait_sec: 300
robot_arm_state_unit: deg
policy_arm_state_unit: rad
robot_gripper_state_unit: rad
policy_gripper_state_unit: normalized
policy_arm_unit: rad
control_arm_unit: deg
policy_gripper_unit: normalized
control_gripper_unit: rad
# 夹爪归一化标定必须与数采仓库 configs/marvin/default.yaml 完全一致。
# gripper 对应左夹爪(A)，gripper2 对应右夹爪(B)；闭合=1，张开=0。
# 当前数采 YAML 仍是空值，请填入实测电机角度后再启动模型部署。
gripper_close_motor_rad:
gripper_open_motor_rad:
gripper2_close_motor_rad:
gripper2_open_motor_rad:

task: "Put all the objects on the desk into the storage box"
# Execute policy actions at 30 Hz (one step every 1/30 second).
execution_horizon: 16
duration: 0.05
chunk_sleep: 0.05

safe_mode: false
dry_run: false
auto_start: false
no_keyboard: false
gripper_open_key: o
gripper_open_limit: min
max_chunks:

arm_interpolation_hz:
arm_interpolation_mode: cubic
# 慢速插值下发参数；slow_dispatch_enabled=false 时，默认推理接口不启用慢速插值。
# 改为 true 后，当前推理入口会使用以下时长、频率和插值方式。
slow_dispatch_enabled: false
# 每个模型动作从当前反馈位置移动到目标位置所用的总时间，单位为秒。
slow_dispatch_duration_sec: 1.0
# 插值子目标的下发频率，单位为 Hz；数值越大，动作越连续。
slow_dispatch_frequency_hz: 20.0
# 插值方式：cubic 为平滑插值，linear 为匀速线性插值。
slow_dispatch_interpolation_mode: cubic
# B/b 复位目标：A/左臂 7 个反馈关节角，单位为度，顺序 J1~J7。
reset_left_arm_q: "150,-90,-90,-120,0,0,0"
# B/b 复位目标：B/右臂 7 个反馈关节角，单位为度，顺序 J1~J7。
reset_right_arm_q: "-150,-90,90,-120,0,0,0"
# B/b 复位目标：夹爪1 对应左/A 侧，反馈电机角度，单位为 rad。
reset_gripper1_motor_rad: -5.0616
# B/b 复位目标：夹爪2 对应右/B 侧，反馈电机角度，单位为 rad。
reset_gripper2_motor_rad: -5.2817
ignore_gripper_safety: false
max_arm_joint_step: 30.0
max_gripper_step: 6.28
