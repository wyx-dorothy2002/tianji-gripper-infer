  right_hand_home: null
  hand_lowpass_cutoff_hz: 5.0
  tianji_sdk_root: /home/user/workspace/DexProj_back_up_0602/wuji-hand-teleop/src/output_devices/tianji_output
  tianji_config_path: /home/user/workspace/DexProj_back_up_0602/wuji-hand-teleop/src/output_devices/tianji_output/tianji_output/config/ccs_m6.MvKDCfg

