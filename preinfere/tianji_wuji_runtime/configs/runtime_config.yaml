# Default runtime arguments. CLI flags in deployment/*.py are the source of truth
# for now; this file documents values that should be pinned per checkpoint.

policy:
  host: 127.0.0.1
  port: 5555
  timeout_ms: 15000

task:
  instruction: "pick up bottle"

